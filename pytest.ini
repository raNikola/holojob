[pytest]
# Collect only the repo's own tests. Without this, a bare `pytest` from the
# root also walks node_modules and other third-party trees, and fails on their
# test suites.
testpaths = tests/python
norecursedirs = node_modules .venv dist .claude claude-config data
# Four workers at most (pytest-xdist), so a run does not starve the home server. -n 0 runs in one process (for -s, a debugger or a single test).
# Every test keeps its state in tmp_path (tests/python/conftest.py), so the workers share nothing; a test that needs a shared file or a fixed port is not allowed.
addopts = -n 4
