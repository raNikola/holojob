name: holojob

services:
  holojob:
    container_name: holojob
    image: localhost/holojob:latest
    build:
      context: .
      args:
        HOLOJOB_COMMIT: ${HOLOJOB_COMMIT:-unknown}

    restart: unless-stopped
    ports:
      - "127.0.0.1:3073:5173"

    volumes:
      - ./data:/app/data:Z
      - ./claude-config:/root/.claude:Z

    env_file:
      - .env

    environment:
      PORT: 5173
      CLAUDE_AUTO_LOGIN: 0
      HOME: /root
