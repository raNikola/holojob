services:
  career-os:
    container_name: career-os
    build: .

    restart: unless-stopped
    ports:
      - "3073:5173"

    volumes:
      - ./data:/app/data:Z
      - ./claude-config:/root/.claude:Z

    env_file:
      - .env

    environment:
      PORT: 5173
      CLAUDE_AUTO_LOGIN: 0
      HOME: /root
